name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux research sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install pinned Windows research sandbox
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sandyPath = Join-Path $env:RUNNER_TEMP 'sandy.exe'
          Invoke-WebRequest 'https://github.com/ahrvoje/sandy_cli/releases/download/v0.9992/sandy.exe' -OutFile $sandyPath
          $digest = (Get-FileHash -LiteralPath $sandyPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne '8a337f199ed7e64bae3088ab247aa485cc063a4ae3e42bec1aad36a48016c535') {
            throw "Sandy binary SHA-256 mismatch: $digest"
          }
          "PI_SCIENCE_SANDY_PATH=$sandyPath" >> $env:GITHUB_ENV

      - name: Verify pinned MCP adapter patch
        if: runner.os == 'Linux'
        run: bash scripts/test-mcp-adapter-patch.sh

      - name: Lint frontend
        run: pnpm --filter frontend lint

      - name: Test POSIX launcher lifecycle
        if: runner.os != 'Windows'
        run: bash scripts/test-launcher.sh

      - name: Typecheck contracts, control plane and frontend
        run: pnpm typecheck

      - name: Test contracts, control plane, frontend and skills
        if: runner.os != 'Windows'
        run: pnpm test

      # Native process integration tests launch Node, bash and taskkill trees.
      # Serializing server files on the two-core Windows runner prevents unrelated
      # 500 ms/15 s characterization deadlines from competing for process slots.
      - name: Test contracts, serialized control plane, frontend and skills
        if: runner.os == 'Windows'
        run: |
          pnpm --filter @pi-science/contracts test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @pi-science/server exec vitest run --fileParallelism=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter frontend test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:skills
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build all JavaScript packages
        run: pnpm build

      - name: Enforce frontend bundle budget
        run: pnpm --filter frontend test:bundle

      - name: Run frontend accessibility smoke
        if: runner.os == 'Linux'
        run: pnpm --filter frontend exec playwright test --config playwright.visual.config.ts --grep @accessibility

      - name: Run control-plane smoke test
        if: runner.os != 'Windows'
        run: bash scripts/smoke-control-plane.sh

  macos-launcher:
    name: macOS launcher smoke
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Test macOS launcher lifecycle
        run: bash scripts/test-launcher.sh

      - name: Test macOS research sandbox integration
        run: pnpm --filter @pi-science/server exec vitest run src/runtime/jobs/research-sandbox.test.ts
