name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Test native Windows file read boundary
        if: runner.os == 'Windows'
        run: pnpm --filter @pi-science/server exec vitest run src/runtime/sandbox/file-read.test.ts src/runtime/agent/worker/workspace-file-tool.test.ts

      - name: Lint frontend
        run: pnpm --filter frontend lint

      - name: Test environment diagnostics
        run: node --test scripts/doctor.test.mjs scripts/check-http-health.test.mjs

      - name: Test Windows process ownership
        if: runner.os == 'Windows'
        run: powershell -NoProfile -File scripts/test-process-identity.ps1

      - name: Test POSIX launcher lifecycle
        if: runner.os != 'Windows'
        run: bash scripts/test-launcher.sh

      - name: Typecheck contracts, control plane and frontend
        run: pnpm typecheck

      - name: Test contracts, control plane, frontend and skills
        if: runner.os != 'Windows'
        run: pnpm test

      # Native process integration tests launch Node, bash and taskkill trees.
      # Serializing server files on the two-core Windows runner prevents unrelated
      # 500 ms/15 s characterization deadlines from competing for process slots.
      - name: Test contracts, serialized control plane, frontend and skills
        if: runner.os == 'Windows'
        run: |
          pnpm --filter @pi-science/contracts test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @pi-science/server exec vitest run --fileParallelism=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter frontend test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:skills
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build all JavaScript packages
        run: pnpm build

      - name: Verify published Web Access CLI from the compiled server
        run: node apps/server/scripts/smoke-web-access.mjs

      - name: Enforce Settings backend performance budgets
        if: runner.os == 'Linux'
        run: |
          node scripts/benchmark-settings.mjs > settings-performance.json
          node scripts/benchmark-provider-credentials.mjs > provider-credential-performance.json

      - name: Upload Settings backend performance metrics
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: settings-backend-performance
          path: |
            settings-performance.json
            provider-credential-performance.json
          if-no-files-found: ignore

      - name: Enforce frontend bundle budget
        run: pnpm --filter frontend test:bundle

      # Reuses the build above. The browser-level SSE budget is the only gate on
      # the frontend's subscription lifecycle, so it must not stay local-only.
      - name: Enforce frontend SSE connection budget
        if: runner.os == 'Linux'
        run: pnpm --filter frontend test:sse-budget

      - name: Run frontend accessibility smoke
        if: runner.os == 'Linux'
        run: pnpm --filter frontend exec playwright test --config playwright.visual.config.ts --grep @accessibility

      - name: Run workspace sidebar interaction tests
        if: runner.os == 'Linux'
        run: |
          pnpm --filter frontend exec playwright test --config playwright.visual.config.ts sidebar.spec.ts --project desktop-light --project mobile --project tablet --output tests/visual/.artifacts/sidebar
          pnpm --filter frontend exec playwright test --config playwright.visual.config.ts app-shell.visual.spec.ts --grep "collapsed context panel" --project desktop-light --project desktop-dark --project desktop-lg --project tablet --project wide --update-snapshots=none --output tests/visual/.artifacts/rail-baseline

      - name: Upload workspace sidebar screenshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: workspace-sidebar-interactions
          path: frontend/tests/visual/.artifacts
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Enforce Settings browser performance budgets
        if: runner.os == 'Linux'
        run: pnpm --filter frontend exec playwright test --config playwright.visual.config.ts settings-performance.spec.ts model-selection-performance.spec.ts --project desktop-light --project mobile

      - name: Upload Settings browser performance metrics
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: settings-browser-performance
          path: frontend/tests/visual/.artifacts
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Run control-plane smoke test
        if: runner.os != 'Windows'
        run: bash scripts/smoke-control-plane.sh

  macos-launcher:
    name: macOS launcher smoke
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Test native macOS file read boundary
        run: pnpm --filter @pi-science/server exec vitest run src/runtime/sandbox/file-read.test.ts src/runtime/agent/worker/workspace-file-tool.test.ts

      - name: Test macOS launcher lifecycle
        run: bash scripts/test-launcher.sh

      - name: Verify Web Access development and compiled entries on macOS
        run: |
          pnpm --filter @pi-science/contracts build
          pnpm --filter @pi-science/server exec vitest run src/mcp/web-access.test.ts src/mcp/web-access-config.test.ts
          pnpm --filter @pi-science/server build
          node apps/server/scripts/smoke-web-access.mjs

  production-install:
    name: production install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PI_SCIENCE_BIN_DIR: ${{ github.workspace }}/work/production-install/pi-science-bin
      PNPM_STORE_DIR: ${{ github.workspace }}/work/production-install/pi-science-store
      PI_SCIENCE_HOME: ${{ github.workspace }}/work/production-install/pi-science-data
      PI_SCIENCE_WORKSPACES: ${{ github.workspace }}/work/production-install/pi-science-workspaces
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      # Intentionally omit pnpm setup: exercise the pinned bootstrap from npm.
      - name: Install and build (POSIX)
        if: runner.os != 'Windows'
        run: bash scripts/install.sh
      - name: Install and build (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1
      - name: Test real production lifecycle
        run: node scripts/smoke-production.mjs
