name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: uv sync --directory backend --extra dev

      - name: Test POSIX launcher lifecycle
        if: runner.os != 'Windows'
        run: bash scripts/test-launcher.sh

      - name: Typecheck contracts, control plane and frontend
        run: pnpm typecheck

      - name: Test contracts, control plane, frontend and skills
        if: runner.os != 'Windows'
        run: pnpm test

      # Native process integration tests launch Node, bash and taskkill trees.
      # Serializing server files on the two-core Windows runner prevents unrelated
      # 500 ms/15 s characterization deadlines from competing for process slots.
      - name: Test contracts, serialized control plane, frontend and skills
        if: runner.os == 'Windows'
        run: |
          pnpm --filter @pi-science/contracts test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @pi-science/server exec vitest run --fileParallelism=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter frontend test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:skills
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build all JavaScript packages
        run: pnpm build

      - name: Enforce frontend bundle budget
        run: pnpm --filter frontend test:bundle

      - name: Test Python scientific runtime
        run: uv run --directory backend pytest -q

      - name: Test skill Python helpers
        run: uv run --directory backend --extra science pytest ../skills/single-cell-rna-qc/tests -q

      - name: Run control-plane smoke test
        if: runner.os != 'Windows'
        run: bash scripts/smoke-control-plane.sh
