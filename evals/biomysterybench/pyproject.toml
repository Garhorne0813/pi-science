[project]
name = "pi-science-biomysterybench"
version = "0.1.0"
description = "Local offline evaluation harness for Anthropic's BioMysteryBench (preview) — eval-only, never used for training"
requires-python = ">=3.11"
license = { text = "MIT" }
readme = { text = "Offline evaluation harness for BioMysteryBench-preview.", content-type = "text/markdown" }
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
